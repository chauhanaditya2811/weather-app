<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="container" aria-live="polite">
      <section class="weather-card">
        <div class="search-area">
          <form id="searchForm" class="search-bar" autocomplete="off">
            <input
              id="cityInput"
              type="text"
              value="Puducherry"
              placeholder="Search city"
              aria-label="Search city"
            />
            <button type="submit">Search</button>
          </form>
          <ul id="suggestions" class="suggestions" aria-label="City suggestions"></ul>
        </div>

        <div class="header-row">
          <div>
            <p class="eyebrow">Live Weather</p>
            <h1 id="city">Loading city...</h1>
          </div>
          <div class="header-actions">
            <div class="weather-token" id="weatherIcon" aria-label="Weather icon">⏳</div>
            <button id="refreshBtn" type="button" class="secondary-btn">Refresh</button>
          </div>
        </div>

        <div class="status-row">
          <div class="temp-wrap">
            <span id="temperature">--</span>
            <span class="unit">°C</span>
          </div>
          <div class="condition-wrap">
            <p class="condition-label">Condition</p>
            <p id="condition">--</p>
          </div>
        </div>

        <div class="details-grid">
          <div class="detail-item">
            <span>Humidity</span>
            <strong id="humidity">--</strong>
          </div>
          <div class="detail-item">
            <span>Wind</span>
            <strong id="windSpeed">--</strong>
          </div>
          <div class="detail-item">
            <span>Country</span>
            <strong id="country">--</strong>
          </div>
          <div class="detail-item">
            <span>Updated</span>
            <strong id="updatedAt">--</strong>
          </div>
        </div>

        <div class="forecast-block">
          <h2>3-Day Forecast</h2>
          <div id="forecast" class="forecast-list"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
